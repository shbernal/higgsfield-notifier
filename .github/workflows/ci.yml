name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint --format github

      - name: Check version
        run: pnpm check:version

      - name: Test
        run: pnpm test

      - name: Package for Chromium
        run: pnpm package

      - name: Lint Firefox build
        run: pnpm lint:firefox

      - name: Package for Firefox
        run: pnpm package:firefox

      - name: Check AMO listing
        run: pnpm publish:amo --dry-run

  commit-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit messages
        uses: commit-check/commit-check-action@82856b070249ac36d5a0f88c47cacf0c70f82fa8 # v2.24.0
        with:
          message: true
          branch: false
